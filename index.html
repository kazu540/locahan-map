<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ロケハン地図</title>
<meta name="description" content="撮影ロケハン用のロケ地ストック地図。場所と光の情報を記録します。">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ロケハン">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<main id="app">

  <!-- 地図（段階5で本物の地図になります） -->
  <section id="view-map" class="view" aria-labelledby="map-title" hidden>
    <header class="large-header">
      <h1 id="map-title">地図</h1>
    </header>
    <div class="empty">
      <div class="empty-icon" aria-hidden="true">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>
      </div>
      <p class="empty-title">地図は準備中です</p>
      <p class="empty-text">記録した場所は「一覧」で見られます。</p>
    </div>
  </section>

  <!-- 一覧 -->
  <section id="view-list" class="view" aria-labelledby="list-title">
    <header class="large-header">
      <h1 id="list-title">ロケ地</h1>
      <p id="list-count" class="subtle"></p>
    </header>
    <div id="spot-list" class="spot-list"></div>
    <div id="list-empty" class="empty" hidden>
      <div class="empty-icon" aria-hidden="true">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
      </div>
      <p class="empty-title">まだ記録がありません</p>
      <p class="empty-text">右下のオレンジの「＋」を押すと、<br>いまいる場所を記録できます。</p>
    </div>
  </section>

  <!-- 設定 -->
  <section id="view-settings" class="view" aria-labelledby="settings-title" hidden>
    <header class="large-header">
      <h1 id="settings-title">設定</h1>
    </header>
    <div class="group">
      <div class="row">
        <span>記録の件数</span>
        <span id="settings-count" class="subtle num">0件</span>
      </div>
      <div class="row">
        <span>アプリの版</span>
        <span id="app-version" class="subtle num"></span>
      </div>
    </div>
    <p class="note">バックアップ（書き出し・読み込み）とタグの管理は、このあとの段階で追加します。</p>
  </section>

</main>

<!-- 下のタブバー -->
<nav class="tabbar glass" aria-label="画面の切り替え">
  <button class="tab" data-view="map" type="button">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>
    <span>地図</span>
  </button>
  <button class="tab" data-view="list" type="button" aria-current="page">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="8" height="10" rx="2"/><rect x="13" y="3" width="8" height="6" rx="2"/><rect x="3" y="15" width="8" height="6" rx="2"/><rect x="13" y="11" width="8" height="10" rx="2"/></svg>
    <span>一覧</span>
  </button>
  <button class="tab" data-view="settings" type="button">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    <span>設定</span>
  </button>
</nav>

<button id="record-btn" class="fab" type="button" aria-label="ここを記録">
  <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
</button>

<!-- シートの背景 -->
<div id="backdrop" class="backdrop" hidden></div>

<!-- 記録シート -->
<section id="record-sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="record-title" hidden>
  <div class="grabber" aria-hidden="true"></div>
  <div class="sheet-header">
    <button id="record-cancel" class="pill-btn" type="button">キャンセル</button>
    <h2 id="record-title">ここを記録</h2>
    <button id="record-save" class="pill-btn accent" type="button" disabled>保存</button>
  </div>
  <div class="sheet-body">
    <div class="card info-card">
      <div class="info-row">
        <div id="loc-icon" class="badge-icon" aria-hidden="true"></div>
        <div class="info-text">
          <span id="loc-title" class="info-title">現在地を取得しています…</span>
          <span id="loc-sub" class="info-sub num"></span>
        </div>
        <button id="loc-retry" class="text-btn" type="button" hidden>もう一度</button>
      </div>
      <p id="loc-help" class="help" hidden></p>
      <div id="manual-loc" class="manual" hidden>
        <label class="field">
          <span>緯度（例：35.6909）</span>
          <input id="manual-lat" type="text" inputmode="decimal" autocomplete="off">
        </label>
        <label class="field">
          <span>経度（例：139.7003）</span>
          <input id="manual-lng" type="text" inputmode="decimal" autocomplete="off">
        </label>
      </div>
      <div class="sep"></div>
      <div class="info-row">
        <div class="badge-icon neutral" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        </div>
        <div class="info-text">
          <span id="time-text" class="info-title num"></span>
        </div>
        <button id="time-edit" class="text-btn" type="button">変更</button>
      </div>
      <label id="time-field" class="field" hidden>
        <span>日時（日本時間）</span>
        <input id="time-input" type="datetime-local">
      </label>
    </div>

    <section class="form-section" aria-labelledby="photo-h">
      <h3 id="photo-h" class="section-title">写真</h3>
      <div id="photo-strip" class="photo-strip">
        <label for="photo-input" class="photo-add">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
          <span>撮る・選ぶ</span>
        </label>
      </div>
      <input id="photo-input" class="visually-hidden" type="file" accept="image/*" multiple>
      <p id="photo-status" class="help" hidden></p>
    </section>

    <section class="form-section" aria-labelledby="light-h">
      <div class="section-head">
        <h3 id="light-h" class="section-title">光の情報</h3>
        <span class="subtle small">自動で計算</span>
      </div>
      <div id="rec-light"></div>
    </section>

    <section class="form-section" aria-labelledby="tag-h">
      <h3 id="tag-h" class="section-title">タグ</h3>
      <div id="tag-picker" class="tag-wrap"></div>
      <div id="tag-add-row" class="tag-add-row" hidden>
        <label class="visually-hidden" for="tag-new">新しいタグの名前</label>
        <input id="tag-new" class="text-input" type="text" maxlength="20" placeholder="例：逆光が綺麗" enterkeyhint="done" autocomplete="off">
        <button id="tag-new-ok" class="pill-btn accent" type="button">追加</button>
      </div>
    </section>

    <section class="form-section">
      <label for="f-title" class="section-title">場所の名前<span class="optional">任意</span></label>
      <input id="f-title" class="text-input" type="text" maxlength="40" placeholder="例：駅前の歩道橋" autocomplete="off">
    </section>

    <section class="form-section">
      <label for="f-memo" class="section-title">メモ<span class="optional">任意</span></label>
      <textarea id="f-memo" class="text-area" rows="3" placeholder="例：夕方は西日が階段に差し込む。平日16時台は人が少ない。"></textarea>
    </section>

    <section class="form-section">
      <label for="f-route" class="section-title">新宿・東京駅からの行き方<span class="optional">任意</span></label>
      <textarea id="f-route" class="text-area" rows="3" placeholder="例：新宿駅 南口から徒歩8分。甲州街道を西へ。"></textarea>
    </section>

    <button id="record-save-bottom" class="big-btn primary" type="button" disabled>保存する</button>
  </div>
</section>

<!-- 詳細シート -->
<section id="detail-sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="detail-name" hidden>
  <div class="grabber" aria-hidden="true"></div>
  <div class="sheet-header">
    <button id="detail-edit" class="pill-btn" type="button">編集</button>
    <span class="sheet-header-title" aria-hidden="true"></span>
    <button id="detail-close" class="pill-btn" type="button">閉じる</button>
  </div>
  <div class="sheet-body">
    <div id="detail-photos" class="carousel" aria-label="写真"></div>
    <p id="detail-photo-count" class="carousel-count num" hidden></p>

    <div class="detail-head">
      <h2 id="detail-name" class="detail-name"></h2>
      <span id="detail-time" class="subtle num"></span>
    </div>
    <div id="detail-tags" class="tag-wrap"></div>

    <div id="detail-memo-card" class="card text-card">
      <h3>メモ</h3>
      <p id="detail-memo"></p>
    </div>
    <div id="detail-route-card" class="card text-card">
      <h3>新宿・東京駅からの行き方</h3>
      <p id="detail-route"></p>
    </div>

    <section class="form-section" aria-labelledby="dlight-h">
      <h3 id="dlight-h" class="section-title">記録したときの光</h3>
      <div id="detail-light"></div>
    </section>

    <div class="card info-card">
      <div class="info-row">
        <div class="badge-icon neutral" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
        </div>
        <div class="info-text">
          <span id="detail-coords" class="info-title num"></span>
          <span id="detail-acc" class="info-sub num"></span>
        </div>
      </div>
    </div>

    <a id="detail-maps" class="big-btn secondary" href="#" target="_blank" rel="noopener">マップアプリで開く</a>
    <div id="delete-area">
      <button id="detail-delete" class="big-btn danger" type="button">この記録を削除</button>
      <div id="delete-confirm" class="confirm" hidden>
        <p>この記録と写真を削除します。元に戻せません。</p>
        <div class="confirm-btns">
          <button id="delete-no" class="big-btn secondary" type="button">やめる</button>
          <button id="delete-yes" class="big-btn danger-fill" type="button">削除する</button>
        </div>
      </div>
    </div>
  </div>
</section>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="vendor/suncalc.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
